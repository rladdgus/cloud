<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="쓸모템 영상에서 소개한 상품을 번호로 찾아보세요.">
<title>쓸모템 링크</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
  :root {
    --bg: #f6f5f2;
    --surface: #ffffff;
    --ink: #1f1b16;
    --muted: #6b645b;
    --line: #e7e3dc;
    --accent: #c2410c;
    --accent-ink: #ffffff;
    --badge: #fde9c8;
    --badge-ink: #7c2d12;
    --focus: #f59e0b;
    --shadow: 0 1px 2px rgba(31, 27, 22, .06), 0 4px 16px rgba(31, 27, 22, .05);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #15120f;
      --surface: #201b16;
      --ink: #f3eee7;
      --muted: #a79e92;
      --line: #342d25;
      --accent: #f59e0b;
      --accent-ink: #1f1405;
      --badge: #3b2a14;
      --badge-ink: #fcd9a0;
      --shadow: none;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #15120f;
    --surface: #201b16;
    --ink: #f3eee7;
    --muted: #a79e92;
    --line: #342d25;
    --accent: #f59e0b;
    --accent-ink: #1f1405;
    --badge: #3b2a14;
    --badge-ink: #fcd9a0;
    --shadow: none;
  }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.55;
    padding-inline: 16px;
  }
  .wrap {
    max-width: 460px;
    margin: 0 auto;
    padding-block: 28px 40px;
    display: grid;
    gap: 20px;
  }

  header { display: grid; justify-items: center; gap: 8px; text-align: center; }
  .avatar {
    width: 76px; height: 76px; border-radius: 50%;
    display: grid; place-items: center;
    background: linear-gradient(160deg, #f59e0b, #b45309);
    color: #fff;
    font-family: "Black Han Sans", "IBM Plex Sans KR", sans-serif;
    font-size: 22px; letter-spacing: .02em;
  }
  h1 {
    margin: 4px 0 0;
    font-family: "Black Han Sans", "IBM Plex Sans KR", sans-serif;
    font-weight: 400;
    font-size: 28px; line-height: 1.15;
    text-wrap: balance;
  }
  .tagline { margin: 0; color: var(--muted); }
  .notice {
    margin: 0;
    font-size: 12.5px; color: var(--muted);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 4px 12px;
  }

  .finder {
    display: flex; gap: 8px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 8px 8px 8px 14px;
    align-items: center;
  }
  .finder label { font-weight: 600; white-space: nowrap; }
  .finder input {
    flex: 1; min-width: 0;
    border: 0; background: transparent; color: var(--ink);
    font: inherit; font-size: 16px;
    padding: 6px 4px;
    font-variant-numeric: tabular-nums;
  }
  .finder input:focus { outline: none; }
  .finder:focus-within { border-color: var(--focus); }
  .finder button {
    border: 0; border-radius: 10px;
    background: var(--ink); color: var(--bg);
    font: inherit; font-weight: 600;
    padding: 8px 14px; cursor: pointer;
  }
  .finder button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .status { margin: -12px 0 0; min-height: 1.4em; font-size: 13px; color: var(--muted); text-align: center; }

  .list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .item a {
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: 14px;
    padding: 14px 14px 14px 12px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    box-shadow: var(--shadow);
    color: inherit; text-decoration: none;
    transition: transform .15s ease, border-color .15s ease;
  }
  .item a:hover { border-color: var(--accent); }
  .item a:active { transform: scale(.99); }
  .item a:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .item.flash a { border-color: var(--accent); animation: pulse 1.2s ease 2; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 6px color-mix(in srgb, var(--accent) 25%, transparent); } }

  .no {
    width: 48px; height: 48px; border-radius: 12px;
    display: grid; place-items: center;
    background: var(--badge); color: var(--badge-ink);
    font-family: "Black Han Sans", "IBM Plex Sans KR", sans-serif;
    font-size: 24px;
    font-variant-numeric: tabular-nums;
  }
  .text { display: grid; gap: 2px; min-width: 0; }
  .name { font-weight: 600; font-size: 16px; }
  .desc { color: var(--muted); font-size: 13.5px; }
  .go {
    background: var(--accent); color: var(--accent-ink);
    font-weight: 600; font-size: 13px;
    border-radius: 999px;
    padding: 7px 12px;
    white-space: nowrap;
  }

  footer {
    display: grid; gap: 6px;
    text-align: center;
    font-size: 12px; color: var(--muted);
    border-top: 1px solid var(--line);
    padding-top: 16px;
  }
  footer p { margin: 0; }

  @media (max-width: 360px) {
    .go { display: none; }
    .item a { grid-template-columns: auto 1fr; }
  }
  @media (prefers-reduced-motion: reduce) {
    .item a, .item.flash a { transition: none; animation: none; }
  }
  body { margin: 0; }
  img { max-width: 100%; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="avatar" aria-hidden="true">쓸모템</div>
    <h1>쓸모템</h1>
    <p class="tagline">매일 하나, 써 보면 쓸모 있는 물건</p>
    <p class="notice">광고 · 쿠팡 파트너스 활동으로 수수료를 받을 수 있어요</p>
  </header>

  <form class="finder" id="finder" autocomplete="off">
    <label for="num">영상 속 번호</label>
    <input id="num" name="num" type="number" inputmode="numeric" min="1" placeholder="예: 2">
    <button type="submit">찾기</button>
  </form>
  <p class="status" id="status" role="status" aria-live="polite"></p>

  <ol class="list" id="list" aria-label="소개한 상품 목록"></ol>

  <footer>
    <p>이 포스팅은 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.</p>
    <p>가격과 재고는 쿠팡 상품 페이지에서 확인해 주세요.</p>
  </footer>
</div>

<script>
  // 새 상품은 맨 아래에 추가하면 번호 순서대로, 최신이 위로 표시돼요.
  const ITEMS = [
    { no: 1, name: "투웨이 오일병", desc: "붓기와 뿌리기, 두 가지로 쓰는 주방 오일병", url: "https://link.coupang.com/a/hkcGjT8xpY" },
    { no: 2, name: "수세미 거치대", desc: "싱크대 수세미를 보송하게 세워 두는 거치대", url: "https://link.coupang.com/a/hkcGkHs0Pc" },
    { no: 3, name: "세면대 팝업 마개", desc: "눌러서 여닫는 세면대 배수구 마개", url: "https://link.coupang.com/a/hkcGk9QTPE" },
  ];

  const list = document.getElementById("list");
  const status = document.getElementById("status");

  for (const item of [...ITEMS].sort((a, b) => b.no - a.no)) {
    const li = document.createElement("li");
    li.className = "item";
    li.id = "n" + item.no;
    const a = document.createElement("a");
    a.href = item.url;
    a.target = "_blank";
    a.rel = "noopener sponsored";
    a.setAttribute("aria-label", `${item.no}번 ${item.name}, 쿠팡에서 보기`);
    a.innerHTML = `
      <span class="no">${item.no}</span>
      <span class="text"><span class="name"></span><span class="desc"></span></span>
      <span class="go" aria-hidden="true">쿠팡에서 보기</span>`;
    a.querySelector(".name").textContent = item.name;
    a.querySelector(".desc").textContent = item.desc;
    li.appendChild(a);
    list.appendChild(li);
  }

  function show(no) {
    const el = document.getElementById("n" + no);
    document.querySelectorAll(".item.flash").forEach(e => e.classList.remove("flash"));
    if (!el) {
      status.textContent = `${no}번 상품이 아직 없어요. 번호를 다시 확인해 주세요.`;
      return;
    }
    status.textContent = "";
    el.scrollIntoView({ behavior: "smooth", block: "center" });
    void el.offsetWidth;
    el.classList.add("flash");
    el.querySelector("a").focus({ preventScroll: true });
  }

  document.getElementById("finder").addEventListener("submit", e => {
    e.preventDefault();
    const no = parseInt(document.getElementById("num").value, 10);
    if (Number.isFinite(no)) show(no);
    else status.textContent = "영상에 나온 번호를 숫자로 입력해 주세요.";
  });

  // 주소 끝에 #n2 처럼 붙이면 해당 상품으로 바로 이동해요.
  const m = location.hash.match(/^#n(\d+)$/);
  if (m) show(parseInt(m[1], 10));
</script>
</body>
</html>
